<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TONA Global</title><style>
:root{font-family:Inter,system-ui,Arial;color:#242037;background:#ffffff}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{border:0;background:#7544e7;color:white;border-radius:12px;padding:11px 15px;cursor:pointer}button.secondary{background:#f0eafb;color:#6539c9}input,textarea,select{border:1px solid #ded9ed;border-radius:11px;padding:12px;width:100%;background:white}header{display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid #ece8f4;padding:15px 24px}.brand{font-size:26px;font-weight:900;color:#6936dc}.logo{display:inline-flex;align-items:center;margin-right:8px}.wrap{max-width:1160px;margin:auto;padding:20px}.panel{background:white;border:1px solid #ece8f4;border-radius:18px;padding:20px;box-shadow:0 5px 24px #37295e08}#auth{max-width:440px;margin:55px auto}.stack{display:grid;gap:12px}.layout{display:grid;grid-template-columns:240px 1fr;gap:20px}.nav{display:grid;align-content:start;gap:9px}.nav button{text-align:left;background:#f7f4ff;color:#4d3b73}.nav button.active{background:#7544e7;color:white}.muted{color:#807891;font-size:13px}.item{padding:13px;border-bottom:1px solid #eeeaf5;display:flex;align-items:center;justify-content:space-between;gap:12px}.item:last-child{border:0}.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}.post{border:1px solid #eee;border-radius:14px;overflow:hidden}.post img,.post video{width:100%;height:260px;object-fit:cover;background:#16121f}.post p{padding:0 12px}.messages{height:340px;overflow:auto;background:#faf9fd;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}.bubble{background:#eae5f8;border-radius:12px;padding:9px 12px;max-width:78%;align-self:flex-start}.bubble.mine{background:#7544e7;color:white;align-self:flex-end}.inline{display:flex;gap:8px;align-items:center}.inline input{flex:1}.hidden{display:none!important}h1,h2{margin:0 0 15px}small{color:#807891}#notice{margin:10px 0;color:#6b39c8;min-height:22px}@media(max-width:700px){.layout{grid-template-columns:1fr}.nav{grid-template-columns:repeat(3,1fr)}.nav button{text-align:center;padding:10px 4px;font-size:12px}.wrap{padding:12px}header{padding:12px}}
.bubble{white-space:pre-wrap;overflow-wrap:anywhere}.messages{height:clamp(280px,52vh,650px)}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:3px solid #bba0ff;outline-offset:2px}#notice{position:sticky;top:0;z-index:5;background:white}input{min-width:0}#sendForm{margin-top:12px}@media(max-width:700px){.panel{padding:14px}.nav{position:sticky;top:0;z-index:2}.feed{grid-template-columns:1fr}.post video,.post img{height:60vh}#auth{margin:20px auto}} </style></head><body><header><div class="brand"><span class="logo"><img src="/static/tona-logo.png" alt="TONA" style="width:34px;height:34px;object-fit:cover;border-radius:9px;vertical-align:middle"></span>TONA <small>Global</small></div><div id="who" class="muted">Do‘stlar bilan yaqinroq</div></header><div class="wrap"><div id="notice" role="status"></div><section id="auth" class="panel"><h2>TONA'ga xush kelibsiz</h2><p class="muted">Email yoki xalqaro telefon raqami bilan kiring. Telefon/email va parol bilan akkaunt yarating. Hozir telefon va email egaligi tasdiqlanmaydi.</p><form id="authForm" class="stack"><input id="username" placeholder="Username (ro‘yxatdan o‘tish uchun)"><input id="contact" required placeholder="Email yoki +998901234567"><input id="password" type="password" required minlength="10" placeholder="Parol (kamida 10 belgi)"><div id="verification" class="stack hidden"><button type="button" class="secondary" id="requestCode">Tasdiqlash kodi yuborish</button><input id="code" inputmode="numeric" maxlength="6" placeholder="6 xonali tasdiqlash kodi" autocomplete="one-time-code"></div><button id="authBtn">Kirish</button></form><p><button class="secondary" id="switchAuth">Akkaunt yaratish</button></p></section><div id="app" class="layout hidden"><aside class="panel nav"><button data-tab="friends" class="active">👥 Do‘stlar</button><button data-tab="chat">💬 Chat</button><button data-tab="reel">▶ Reels</button><button data-tab="story">◉ Stories</button><button data-tab="profile">👤 Profil</button><button data-tab="calls">📞 Qo‘ng‘iroqlar</button><button id="logout" class="secondary">Chiqish</button></aside><main class="panel" id="content"></main></div></div><script>
let verificationRequired=false;let mediaBlobs=[];let token=localStorage.getItem('tona_token'),user=null,tab='friends',register=false,activeChat=null,ws=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(t){$('notice').textContent=t;setTimeout(()=>{if($('notice').textContent===t)$('notice').textContent=''},6000)}
async function api(path,method='GET',body){let opts={method,headers:{Authorization:'Bearer '+token}};if(body instanceof FormData)opts.body=body;else if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}let r=await fetch('/api'+path,opts),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'Kiritilgan ma’lumotlarni tekshiring');return d}
function showAuth(){ $('auth').classList.remove('hidden');$('app').classList.add('hidden');$('authBtn').textContent=register?'Ro‘yxatdan o‘tish':'Kirish';$('switchAuth').textContent=register?'Akkauntim bor — kirish':'Akkaunt yaratish';$('username').classList.toggle('hidden',!register);$('verification').classList.toggle('hidden',!register||!verificationRequired);$('code').required=register&&verificationRequired;$('username').required=register}
$('switchAuth').onclick=()=>{register=!register;showAuth()};$('authForm').onsubmit=async e=>{e.preventDefault();try{let d=await fetch('/api/'+(register?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,contact:$('contact').value,password:$('password').value,code:$('code').value})});let x=await d.json();if(!d.ok)throw Error(typeof x.detail==='string'?x.detail:'Ma’lumotlarni va 6 xonali kodni tekshiring');token=x.token;localStorage.setItem('tona_token',token);await start();if(register)notice(verificationRequired?'Akkaunt tasdiqlandi va yaratildi.':'Akkaunt yaratildi. Telefon/email tasdiqlanmagan.')}catch(e){notice(e.message)}};
async function start(){try{user=await api('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='@'+user.username;connect();await render()}catch(e){token=null;localStorage.removeItem('tona_token');showAuth()}}
let reconnectTimer, heartbeat;
function connect(){
 clearTimeout(reconnectTimer);clearInterval(heartbeat);
 if(ws){ws.onclose=null;ws.close()}
 const socket=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws=socket;
 socket.onopen=()=>{socket.send(JSON.stringify({token}));heartbeat=setInterval(()=>{if(socket.readyState===1)socket.send('ping')},25000)};
 socket.onmessage=e=>{let d=JSON.parse(e.data);if(d.type==='message'&&tab==='chat'&&activeChat&&(d.message.sender===activeChat||d.message.recipient===activeChat))loadMessages()};
 socket.onclose=()=>{clearInterval(heartbeat);if(token)reconnectTimer=setTimeout(()=>{connect();if(tab==='chat')loadMessages()},3000)};
}
$('requestCode').onclick=async()=>{let b=$('requestCode');b.disabled=true;try{await api('/auth/request-code','POST',{contact:$('contact').value});notice('Kod yuborildi. SMS yoki emailingizni tekshiring.')}catch(e){notice(e.message)}finally{b.disabled=false}};
$('logout').onclick=async()=>{try{await api('/logout','POST')}catch{}localStorage.removeItem('tona_token');token=null;user=null;if(ws)ws.close();clearInterval(heartbeat);clearTimeout(reconnectTimer);activeChat=null;$('who').textContent='Do‘stlar bilan yaqinroq';showAuth()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});
async function render(){try{if(tab==='friends')await renderFriends();if(tab==='chat')await renderChat();if(tab==='reel'||tab==='story')await renderFeed();if(tab==='profile')$('content').innerHTML='<h2>Mening profilim</h2><p><b>@'+esc(user.username)+'</b></p><p>'+esc(user.contact)+'</p><p class="muted">Reels va Stories faqat tasdiqlangan do‘stlarga ko‘rinadi.</p>';if(tab==='calls')$('content').innerHTML='<h2>Audio va videoqo‘ng‘iroqlar</h2><p>Qo‘ng‘iroq interfeysi keyingi bosqichda WebRTC signalizatsiyasi, TURN va ruxsat nazorati bilan ulanadi. Hozir bu funksiya ishlamaydi.</p>'}catch(e){notice(e.message)}}
async function renderFriends(){let [friends,users]=await Promise.all([api('/friends'),api('/users')]);let accepted=friends.filter(x=>x.status==='accepted');$('content').innerHTML='<h2>Do‘stlar</h2><p class="muted">Global qidiruv; Reels va chat faqat tasdiqlangan do‘stlar bilan.</p><input id="search" placeholder="Username bo‘yicha qidirish"><div id="found"></div><h3>So‘rovlar</h3><div id="requests"></div><h3>Mening do‘stlarim</h3><div id="accepted"></div>';
function showUsers(q){let ids=new Set(friends.map(f=>f.id));$('found').innerHTML=users.filter(u=>u.username.toLowerCase().includes(q.toLowerCase())&&!ids.has(u.id)).map(u=>'<div class="item"><b>@'+esc(u.username)+'</b><button data-add="'+u.id+'">Do‘st qo‘shish</button></div>').join('')||'<p class="muted">Foydalanuvchi topilmadi</p>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=async()=>{try{await api('/friends/request','POST',{user_id:+b.dataset.add});notice('So‘rov yuborildi');renderFriends()}catch(e){notice(e.message)}})}let searchTimer;$('search').oninput=e=>{let q=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{users=await api('/users?q='+encodeURIComponent(q));if($('search'))showUsers(q)}catch(e){notice(e.message)}},250)};showUsers('');
$('requests').innerHTML=friends.filter(x=>x.status==='pending').map(x=>'<div class="item">@'+esc(x.username)+' '+(x.requester===user.id?'<small>So‘rov yuborilgan</small>':'<button data-accept="'+x.id+'">Qabul qilish</button>')+'</div>').join('')||'<p class="muted">So‘rov yo‘q</p>';document.querySelectorAll('[data-accept]').forEach(b=>b.onclick=async()=>{await api('/friends/'+b.dataset.accept+'/accept','POST');renderFriends()});$('accepted').innerHTML=accepted.map(x=>'<div class="item"><b>@'+esc(x.username)+'</b><button data-chat="'+x.id+'">Chat</button><button class="secondary" data-remove="'+x.id+'">Kontaktni o‘chirish</button></div>').join('')||'<p class="muted">Hali do‘stlar yo‘q</p>';document.querySelectorAll('[data-chat]').forEach(b=>b.onclick=()=>{activeChat=+b.dataset.chat;tab='chat';render()})}
document.addEventListener('click',async e=>{let id=e.target.dataset.remove;if(!id)return;try{await api('/friends/'+id,'DELETE');notice('Kontakt o‘chirildi. Endi reels ko‘rinmaydi.');renderFriends()}catch(error){notice(error.message)}});
async function renderChat(){let f=(await api('/friends')).filter(x=>x.status==='accepted');$('content').innerHTML='<h2>Shaxsiy chat</h2><p class="muted">Bu MVP chatida end-to-end shifrlash hali mavjud emas.</p><select id="chatSelect"><option value="">Do‘stni tanlang</option>'+f.map(x=>'<option value="'+x.id+'" '+(activeChat===x.id?'selected':'')+'>@'+esc(x.username)+'</option>').join('')+'</select><div class="messages" id="messages"></div><form class="inline" id="sendForm"><input id="msg" maxlength="4000" placeholder="Xabar yozing..." required><button>Yuborish</button></form>';$('chatSelect').onchange=e=>{activeChat=+e.target.value;loadMessages()};$('sendForm').onsubmit=async e=>{e.preventDefault();if(!activeChat)return notice('Do‘stni tanlang');try{await api('/messages','POST',{recipient:activeChat,body:$('msg').value});$('msg').value='';await loadMessages()}catch(e){notice(e.message)}};await loadMessages()}
async function loadMessages(){if(!$('messages'))return;if(!activeChat){$('messages').innerHTML='<p class="muted">Suhbatni boshlash uchun do‘st tanlang</p>';return}try{let m=await api('/messages/'+activeChat);$('messages').innerHTML=m.map(x=>'<div class="bubble '+(x.sender===user.id?'mine':'')+'">'+esc(x.body)+'</div>').join('');$('messages').scrollTop=$('messages').scrollHeight}catch(e){notice(e.message)}}
async function renderFeed(){mediaBlobs.forEach(URL.revokeObjectURL);mediaBlobs=[];let kind=tab,posts=await api('/feed?kind='+kind);for(let p of posts){try{let response=await fetch(p.media_url,{headers:{Authorization:'Bearer '+token}});if(response.ok){p.private_src=URL.createObjectURL(await response.blob());mediaBlobs.push(p.private_src)}}catch(e){}}$('content').innerHTML='<h2>'+(kind==='reel'?'Reels':'Stories')+' — faqat do‘stlarga</h2><p class="muted">Joylagan media faylingiz faqat tasdiqlangan do‘stlar lentasida chiqadi. Media fayllar faqat muallif va tasdiqlangan do‘stlar uchun autentifikatsiya orqali ochiladi.</p><form id="postForm" class="stack"><input id="file" type="file" accept="image/*,video/mp4,video/webm" required><input id="caption" placeholder="Izoh"><button>Joylash</button></form><h3>Do‘stlar lentasi</h3><div class="feed">'+posts.map(p=>'<article class="post">'+(p.media_url.match(/\.(mp4|webm)$/)?'<video controls src="'+esc(p.private_src||'')+'"></video>':'<img src="'+esc(p.private_src||'')+'" alt="Media">')+'<p><b>@'+esc(p.username)+'</b></p><p>'+esc(p.caption)+'</p>'+(p.user_id===user.id?'<p><button class="secondary" data-delete-post="'+p.id+'">O‘chirish</button></p>':'')+'</article>').join('')+'</div>';$('postForm').onsubmit=async e=>{e.preventDefault();try{let fd=new FormData();fd.append('file',$('file').files[0]);let x=await api('/upload','POST',fd);await api('/posts','POST',{kind,media_url:x.media_url,caption:$('caption').value});notice('Joylandi');renderFeed()}catch(e){notice(e.message)}}}
document.addEventListener('click',async e=>{let id=e.target.dataset.deletePost;if(!id)return;try{await api('/posts/'+id,'DELETE');renderFeed()}catch(error){notice(error.message)}});
fetch('/api/config').then(r=>r.json()).then(c=>{verificationRequired=c.verification_required;if(!user)showAuth()}).catch(()=>{});
if(token)start();else showAuth();
</script></body></html>
