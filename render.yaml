services:
  - type: web
    name: tona-global-server
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: TONA_DATA_DIR
        value: /data
      - key: TONA_REQUIRE_VERIFICATION
        value: "false"
      - key: TONA_EPHEMERAL
        value: "true"
      - key: TONA_OWNER_USERNAME
        value: nosirkhon
